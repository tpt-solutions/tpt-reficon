[package]
name = "tpt-reficon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime support types for code generated by tpt-reficon's proc macros."
documentation = "https://docs.rs/tpt-reficon-core"
keywords = ["refinement-types", "runtime-check", "fractional-permissions", "atomics", "contracts"]
categories = ["development-tools", "rust-patterns", "concurrency"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
tpt-reficon-verifier = { version = "0.1.0", path = "../tpt-reficon-verifier", optional = true }

[features]
default = []
# Lock-free fractional-permission accessor (prototype; API may change).
unstable = []
# Enables solver-backed helpers exercised by macro-debugging tooling only.
verifier = ["dep:tpt-reficon-verifier"]