[package]
name = "tpt-reficon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Refinement types, FFI contracts, and fractional borrows for Rust, verified by an in-house QF_LRA solver."
keywords = ["refinement-types", "ffi", "contracts", "formal-verification", "lra-solver"]
categories = ["development-tools", "development-tools::ffi"]
readme = "README.md"
documentation = "https://docs.rs/tpt-reficon"

[lints]
workspace = true

[dependencies]
tpt-reficon-core = { version = "0.1.0", path = "../tpt-reficon-core" }
tpt-reficon-macros = { version = "0.1.0", path = "../tpt-reficon-macros" }

[features]
default = []
# Fractional-borrow prototype (semantics may change between releases).
unstable = ["tpt-reficon-core/unstable", "tpt-reficon-macros/unstable"]
# `#[ffi_contract]`: C header ingestion through bindgen (needs libclang at build time).
ffi = ["tpt-reficon-macros/ffi-bindgen"]
[dev-dependencies]
# Used only by the serde integration test, which checks the derived Deserialize.
serde = { version = "1", default-features = false, features = ["std"] }

[package.metadata.docs.rs]
# Not all-features: `ffi` needs libclang at build time, which docs.rs lacks.
features = ["unstable"]

[[example]]
name = "shared_counter"
required-features = ["unstable"]
