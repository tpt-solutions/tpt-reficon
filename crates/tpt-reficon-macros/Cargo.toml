[package]
name = "tpt-reficon-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro frontend for tpt-reficon: refinement types, function contracts, FFI contracts."
documentation = "https://docs.rs/tpt-reficon-macros"
keywords = ["proc-macro", "refinement-types", "contracts", "ffi", "derive"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]
readme = "README.md"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
tpt-reficon-verifier = { version = "0.1.0", path = "../tpt-reficon-verifier" }
# Needed so generated code references the runtime crate under whatever name
# the user's Cargo.toml actually uses (e.g. a renamed `tpt-reficon-core`).
proc-macro-crate = "3"

# Optional: C header ingestion for `#[ffi_contract]`. bindgen needs libclang at
# build time, so the default build does not pull it in.
bindgen = { version = "0.73", optional = true }

[features]
default = []
# Enables `#[fractional_borrow]` (prototype; API may change).
unstable = []
# Enables `#[ffi_contract]`, which parses C headers through bindgen.
ffi-bindgen = ["dep:bindgen"]

[dev-dependencies]
trybuild = "1"
tpt-reficon-core = { version = "0.1.0", path = "../tpt-reficon-core" }
proptest = "1"