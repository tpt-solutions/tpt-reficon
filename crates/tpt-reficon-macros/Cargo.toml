[package]
name = "tpt-reficon-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro frontend for tpt-reficon: refinement types, function contracts, FFI contracts."
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tpt-reficon-verifier = { version = "0.1.0", path = "../tpt-reficon-verifier" }
# Needed so generated code references the runtime crate under whatever name
# the user's Cargo.toml actually uses (e.g. a renamed `tpt-reficon-core`).
proc-macro-crate = "3"

[dev-dependencies]
trybuild = "1"
tpt-reficon-core = { version = "0.1.0", path = "../tpt-reficon-core" }
proptest = "1"