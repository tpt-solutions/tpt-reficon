version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/crates/tpt-reficon-ffi-tests"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: "/crates/tpt-reficon/tests/go/payment"
    schedule:
      interval: weekly
